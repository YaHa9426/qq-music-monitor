name: QQ音乐免费会员活动监控

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git repo
      - name: 安装依赖
        run: |
          cd repo
          pip install requests
      - name: 运行监控脚本
        env:
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
        run: |
          cd repo
          python3 src/monitor.py
